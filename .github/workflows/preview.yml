name: Validate Voidfun
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voidfun-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node --test tests/services.test.mjs
      - run: node scripts/test-networks.mjs
      - run: |
          foreach ($id in @(46630,11155111,84532,763373,5042002)) {
            $env:TEST_CHAIN_ID="$id"
            node scripts/test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test
